name: Cyberion ThreatShield CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Engineering Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl pyyaml

    - name: Execute Automated Sigma Rule Audit
      run: |
        python sigma_validator.py

    - name: Verify Core Ingestion Pipeline Execution
      run: |
        python run_pipeline.py
