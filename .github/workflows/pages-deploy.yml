name: Deploy Static Documentation to Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'playbooks/**'
      - 'reports/**'
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Pages Platform
      uses: actions/configure-pages@v4

    - name: Upload Static Content Artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        # Uploads the entire root directory content to web view
        path: '.'

    - name: Deploy to GitHub Pages Live Target
      id: deployment
      uses: actions/deploy-pages@v4
