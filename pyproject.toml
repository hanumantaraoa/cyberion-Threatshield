[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberion-threatshield"
version = "2.0.0"
description = "Detection Engineering & Threat Hunting Workbench for log normalization, Sigma rule validation, and incident lifecycles."
readme = "README.md"
authors = [
    { name = "Cyberion Security Engineer", email = "soc-eng@cyberion-defense.local" }
]
license = { text = "Internal Use — Engineering Program" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Intended Audience :: Information Technology"
]
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "Evtx>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "notebook>=7.3.0",
    "ipykernel>=6.29.0"
]

[tool.setuptools]
py-modules = ["telemetry_parser", "sigma_validator", "run_pipeline"]
